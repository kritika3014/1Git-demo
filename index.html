<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bunk Planner Pro </title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <h1><i class="fa-solid fa-graduation-cap"></i> Bunk Planner Pro</h1>
    <p class="subtitle">Bunk classes</p>
    <div class="input-box">
      <label><i class="fa-solid fa-book"></i> Subject Name</label>
      <input type="text" id="subName" placeholder="Ex: DBMS">
      <div class="row">
        <div>
          <label><i class="fa-solid fa-bullseye"></i> Target %</label>
          <select id="targetPer">
            <option value="75">75%</option>
            <option value="80">80%</option>
            <option value="85" selected>85%</option>
          </select>
        </div>
        <div>
          <label><i class="fa-solid fa-layer-group"></i> Total in Sem</label>
          <input type="number" id="totalSem" placeholder="Ex: 32">
        </div>
      </div>
      <label><i class="fa-solid fa-calendar-check"></i> Till Now - Total Held</label>
      <input type="number" id="total" placeholder="Ex: 20">
      <label><i class="fa-solid fa-user-check"></i> Till Now - Attended</label>
      <input type="number" id="attended" placeholder="Ex: 15">
      <div class="divider">This Week</div>
      <div class="row">
        <div><label>This Week Total</label><input type="number" id="weekTotal" placeholder="Ex: 5"></div>
        <div><label>This Week Attended</label><input type="number" id="weekAtt" placeholder="Ex: 3"></div>
      </div>
      <button class="submit-end" onclick="submitAndGo()"><i class="fa-solid fa-rocket"></i> Submit & View Dashboard</button>
    </div>
    <div id="subjectList"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
